<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EcoTrail Montenegro | Explore Naturally</title>
<style>
:root {
  --green:#244b38;
  --dark:#183528;
  --cream:#f7f5ed;
  --sage:#e4eadf;
  --text:#26372d;
  --muted:#68776c;
  --white:#fff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--text);font-family:Arial,sans-serif;line-height:1.6}
header{background:var(--green);color:white;padding:20px 7%;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.logo{font-size:1.35rem;font-weight:bold;letter-spacing:.3px}
nav{display:flex;gap:20px;flex-wrap:wrap}
nav a{color:white;text-decoration:none;font-weight:600}
nav a:hover{text-decoration:underline}
a{color:var(--green)}
.hero{padding:75px 7%;background:linear-gradient(120deg,#244b38,#496d50);color:white}
.hero h1{font-size:clamp(2.3rem,5vw,4.4rem);line-height:1.1;max-width:750px;margin:0 0 20px}
.hero p{font-size:1.1rem;max-width:650px}
.button{display:inline-block;background:var(--green);color:white;text-decoration:none;border:0;border-radius:8px;padding:12px 18px;font-weight:bold;cursor:pointer;font-size:.95rem}
.button:hover{background:var(--dark)}
.hero .button{background:#fff;color:var(--green);margin-top:12px}
section{padding:45px 7%}
.section-heading{margin-bottom:24px}
.section-heading h2{font-size:2rem;margin:0 0 5px}
.section-heading p{color:var(--muted);margin:0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:22px}
.card{background:white;border-radius:14px;overflow:hidden;box-shadow:0 4px 16px #193b2710;display:flex;flex-direction:column}
.card-top{min-height:145px;background:var(--sage);display:flex;align-items:center;justify-content:center;font-size:4rem}
.card-content{padding:22px;display:flex;flex-direction:column;align-items:flex-start;flex:1}
.card-content h3{margin:0 0 7px;font-size:1.25rem}
.card-content p{margin:0 0 14px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px}
.tag{font-size:.8rem;padding:5px 9px;border-radius:30px;background:var(--sage);color:var(--green)}
.card-content .button{margin-top:auto}
.about{background:var(--sage)}
.about-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px}
.about-grid h3{margin-bottom:5px}
.about-grid p{color:var(--muted);margin-top:0}
.page{padding:35px 7% 60px;min-height:60vh}
.back{display:inline-block;margin-bottom:25px;text-decoration:none;font-weight:bold}
.detail-hero{padding:32px;background:var(--sage);border-radius:16px;margin-bottom:25px}
.detail-hero .emoji{font-size:3.5rem}
.detail-hero h1{font-size:clamp(2rem,4vw,3rem);line-height:1.15;margin:5px 0 10px}
.detail-hero p{max-width:750px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:22px 0}
.fact{background:white;border-radius:10px;padding:15px}
.fact strong{display:block;color:var(--green)}
.detail-grid{display:grid;grid-template-columns:2fr 1fr;gap:25px}
.panel{background:white;padding:24px;border-radius:14px;margin-bottom:20px}
.panel h2,.panel h3{margin-top:0}
.panel li{margin-bottom:8px}
.guide-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.guide{background:white;padding:22px;border-radius:14px}
.avatar{font-size:2.8rem}
.guide h3{margin:5px 0}
.guide p{color:var(--muted)}
footer{background:var(--dark);color:white;text-align:center;padding:25px 7%}
footer p{margin:4px}
form label{display:block;font-weight:bold;margin:12px 0 5px}
input,select,textarea{width:100%;padding:11px;border:1px solid #ccd5cc;border-radius:7px;font:inherit}
textarea{min-height:85px}
form button{margin-top:15px}
.notice{background:#f5f0dc;padding:12px;border-radius:8px;font-size:.9rem}
[hidden]{display:none!important}
@media(max-width:650px){
 header{padding:18px 5%}
 nav{gap:12px}
 .hero,section,.page{padding:32px 5%}
 .detail-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header>
  <a href="#" class="logo" style="color:white;text-decoration:none">🌿 EcoTrail Montenegro</a>
  <nav>
    <a href="#home">Home</a>
    <a href="#trails">Trails</a>
    <a href="#guides">Local guides</a>
    <a href="#about">About</a>
  </nav>
</header>

<main id="app"></main>

<footer>
  <p><strong>🌿 EcoTrail Montenegro</strong></p>
  <p>Explore responsibly. Discover locally. Leave no trace.</p>
  <p>Student project · Montenegro</p>
</footer>

<script>
const trails = [
{
 id:"black-lake",name:"Black Lake Loop",place:"Žabljak · Durmitor National Park",
 emoji:"🏞️",level:"Easy",distance:"3.5 km",duration:"1–1.5 hours",season:"Spring–autumn",
 intro:"A peaceful walk around the famous glacial lake, surrounded by dense pine forest and dramatic mountain scenery.",
 description:"Black Lake, known locally as Crno Jezero, is one of Montenegro's best-known natural attractions. The loop is a lovely introduction to Durmitor, with forest paths, lake views and plenty of places to pause and enjoy the scenery.",
 highlights:["Beautiful reflections of the surrounding mountains","Pine forest and fresh mountain air","Great for beginners and families","Photography and picnic opportunities"],
 tips:["Wear comfortable walking shoes.","Bring water and take your rubbish with you.","Stay on marked paths and respect wildlife.","Mountain weather can change quickly."]
},
{
 id:"kotor-fortress",name:"Kotor Fortress Trail",place:"Kotor Old Town · Bay of Kotor",
 emoji:"🏰",level:"Moderate",distance:"Approx. 4.5 km return",duration:"2–3 hours",season:"Spring–autumn",
 intro:"Climb above the medieval rooftops of Kotor for spectacular views of the bay and surrounding mountains.",
 description:"This historic uphill route follows stone steps and paths above Kotor's Old Town. The climb is steep in places, but the panoramic views over the red rooftops and blue bay make it memorable.",
 highlights:["Panoramic views of the Bay of Kotor","Historic fortifications and stone paths","A unique mix of culture and nature","Wonderful early-morning photography"],
 tips:["Start early to avoid heat and crowds.","Carry water; much of the climb is exposed.","Wear shoes with good grip.","Check access conditions and any entrance fees before visiting."]
},
{
 id:"bobotov-kuk",name:"Bobotov Kuk Adventure",place:"Durmitor National Park",
 emoji:"⛰️",level:"Difficult",distance:"Approx. 10–12 km return",duration:"6–8 hours",season:"Summer, conditions permitting",
 intro:"A challenging high-mountain adventure toward one of Durmitor's most famous peaks.",
 description:"Bobotov Kuk is a demanding mountain objective for experienced hikers. The terrain can be rocky and exposed, and conditions change rapidly. This route should only be attempted with suitable preparation and reliable local information.",
 highlights:["Impressive limestone mountain landscapes","High-altitude views across Durmitor","A rewarding challenge for experienced hikers","Unique alpine plants and scenery"],
 tips:["Check the weather and trail conditions before departure.","Carry appropriate layers, food and plenty of water.","Do not attempt the route in poor weather.","Consider an experienced local mountain guide."]
},
{
 id:"biogradska-gora",name:"Biogradska Gora Forest Walk",place:"Biogradska Gora National Park",
 emoji:"🌲",level:"Easy",distance:"Approx. 3.5 km",duration:"1–2 hours",season:"Spring–autumn",
 intro:"Explore an ancient forest and enjoy a gentle walk beside the beautiful waters of Biogradsko Lake.",
 description:"Biogradska Gora protects one of Europe's remarkable old-growth forests. This gentle lakeside walk offers a relaxing way to discover native trees, peaceful woodland and the park's rich biodiversity.",
 highlights:["Lakeside scenery","Ancient forest and native plants","Birdwatching opportunities","A relaxed route suitable for many visitors"],
 tips:["Keep noise low to avoid disturbing wildlife.","Stay on marked trails.","Take all litter away with you.","Check park opening conditions before travelling."]
},
{
 id:"ladder-of-kotor",name:"Ladder of Kotor",place:"Kotor · Vrmac mountain slopes",
 emoji:"🥾",level:"Moderate–difficult",distance:"Varies by starting point",duration:"3–5 hours",season:"Spring–autumn",
 intro:"Follow historic zigzag paths above the bay and discover a different perspective on Montenegro's dramatic coast.",
 description:"The historic paths above Kotor wind up the mountainside through a series of bends and stone sections. The ascent is rewarding but can be strenuous, especially in the heat.",
 highlights:["Wide views over the Bay of Kotor","Historic mountain paths","Quiet scenery away from the waterfront","Excellent opportunities for landscape photography"],
 tips:["Begin early and avoid the hottest part of the day.","Bring enough water and sun protection.","Use sturdy shoes and watch your footing.","Research your chosen route and return plan in advance."]
},
{
 id:"lovcen",name:"Lovćen Forest Trail",place:"Lovćen National Park",
 emoji:"🌳",level:"Easy–moderate",distance:"Approx. 4 km",duration:"1.5–2.5 hours",season:"Spring–autumn",
 intro:"Discover mountain forest, fresh air and beautiful views in the heart of Lovćen National Park.",
 description:"This sample walking route introduces visitors to the forested landscapes of Lovćen. The park's mix of woodland, rocky terrain and mountain viewpoints makes it a rewarding destination for nature lovers.",
 highlights:["Mountain forest and fresh air","Local plant life and natural habitats","Peaceful walking away from busy towns","A good addition to a national park visit"],
 tips:["Check local trail signage and conditions.","Bring layers, as mountain temperatures can change.","Respect protected habitats.","Carry your rubbish back with you."]
}
];

const guides = [
{id:"milica",name:"Milica Vuković",emoji:"👩🏻‍🦱",specialty:"Nature & ecology",languages:"Montenegrin, English",bio:"Milica is a fictional eco-guide who loves sharing Montenegro's forests, plants and wildlife. Her tours focus on low-impact travel and protecting natural habitats."},
{id:"marko",name:"Marko Petrović",emoji:"🧔🏻",specialty:"Mountain hiking",languages:"Montenegrin, English, Serbian",bio:"Marko is a fictional hiking guide with a passion for mountain landscapes. He helps visitors understand trail preparation, mountain safety and responsible hiking."},
{id:"ana",name:"Ana Radović",emoji:"👩🏻",specialty:"Culture & local heritage",languages:"Montenegrin, English",bio:"Ana is a fictional local guide who combines outdoor walks with stories about Montenegro's historic towns, traditions and communities."}
];

const app = document.getElementById("app");

function trailCard(t){
 return `<article class="card">
   <div class="card-top">${t.emoji}</div>
   <div class="card-content">
     <h3>${t.name}</h3>
     <p>${t.intro}</p>
     <div class="tags"><span class="tag">${t.level}</span><span class="tag">${t.distance}</span></div>
     <a class="button" href="#trail/${t.id}">View trail details →</a>
   </div>
 </article>`;
}

function homePage(){
 return `
 <section class="hero" id="home">
   <p>YOUR OUTDOOR COMMUNITY IN MONTENEGRO</p>
   <h1>Find your path. Protect your place.</h1>
   <p>Discover Montenegro's lakes, forests, mountains and historic paths. Plan your next adventure while travelling responsibly and supporting local communities.</p>
   <a class="button" href="#trails">Explore the trails ↓</a>
 </section>
 <section id="trails">
   <div class="section-heading"><h2>Explore the trails</h2><p>Find an adventure that matches your interests and experience.</p></div>
   <div class="cards">${trails.map(trailCard).join("")}</div>
 </section>
 <section class="about" id="about">
   <div class="section-heading"><h2>Travel gently. Discover more.</h2><p>EcoTrail Montenegro encourages responsible outdoor tourism.</p></div>
   <div class="about-grid">
     <div><h3>🌱 Protect nature</h3><p>Stay on marked trails, respect wildlife and leave natural places as you found them.</p></div>
     <div><h3>🤝 Support local people</h3><p>Discover local guides, small businesses and the stories behind each destination.</p></div>
     <div><h3>🥾 Be prepared</h3><p>Choose routes that suit your ability and check the weather before setting out.</p></div>
   </div>
 </section>
 <section id="guides">
   <div class="section-heading"><h2>Meet our local guides</h2><p>Meet our fictional guide profiles and explore their specialities.</p></div>
   <div class="guide-list">${guides.map(g=>`<article class="guide"><div class="avatar">${g.emoji}</div><h3>${g.name}</h3><p>${g.specialty}</p><p>${g.bio}</p><a class="button" href="#guide/${g.id}">View guide →</a></article>`).join("")}</div>
 </section>`;
}

function trailPage(t){
 return `<section class="page">
 <a class="back" href="#trails">← Back to all trails</a>
 <div class="detail-hero"><div class="emoji">${t.emoji}</div><p>${t.place}</p><h1>${t.name}</h1><p>${t.intro}</p>
 <div class="facts">
   <div class="fact"><strong>Difficulty</strong>${t.level}</div>
   <div class="fact"><strong>Distance</strong>${t.distance}</div>
   <div class="fact"><strong>Duration</strong>${t.duration}</div>
   <div class="fact"><strong>Best season</strong>${t.season}</div>
 </div></div>
 <div class="detail-grid"><div>
   <article class="panel"><h2>About this trail</h2><p>${t.description}</p></article>
   <article class="panel"><h2>Trail highlights</h2><ul>${t.highlights.map(x=>`<li>${x}</li>`).join("")}</ul></article>
   <article class="panel"><h2>Responsible hiking tips</h2><ul>${t.tips.map(x=>`<li>${x}</li>`).join("")}</ul></article>
 </div><aside>
   <article class="panel"><h2>Explore with a guide</h2><p>Want to learn more about the area? View our guide profiles or send a demo booking request.</p><a class="button" href="#guides">Meet the guides</a></article>
   <article class="panel"><h3>Plan your visit</h3><p>Check local conditions, weather, access restrictions and any park fees before you leave.</p><button class="button" onclick="openBooking('${t.id}')">Request a tour</button></article>
 </aside></div></section>`;
}

function guidePage(g){
 return `<section class="page">
 <a class="back" href="#guides">← Back to all guides</a>
 <article class="detail-hero"><div class="emoji">${g.emoji}</div><h1>${g.name}</h1><p>${g.specialty}</p><div class="facts"><div class="fact"><strong>Speciality</strong>${g.specialty}</div><div class="fact"><strong>Languages</strong>${g.languages}</div><div class="fact"><strong>Profile</strong>Fictional demo guide</div></div></article>
 <article class="panel"><h2>About the guide</h2><p>${g.bio}</p><p class="notice">This is a school project. The guide profiles are fictional and tours are not actually bookable.</p><button class="button" onclick="openBooking('')">Send a demo tour request</button></article>
 </section>`;
}

function bookingPage(){
 return `<section class="page"><a class="back" href="#trails">← Back to trails</a><div class="panel"><h1>Tour request</h1><p>This is a demonstration form for the EcoTrail Montenegro school project.</p><form id="bookingForm"><label for="visitor">Your name</label><input id="visitor" required placeholder="Enter your name"><label for="email">Email address</label><input id="email" type="email" required placeholder="you@example.com"><label for="tour">Preferred trail</label><select id="tour">${trails.map(t=>`<option value="${t.id}">${t.name}</option>`).join("")}</select><label for="message">Additional notes</label><textarea id="message" placeholder="Tell us about your plans"></textarea><button class="button" type="submit">Submit demo request</button></form><p id="formMessage" role="status"></p></div></section>`;
}

function openBooking(id){
 location.hash = "booking" + (id ? "/" + id : "");
}

function render(){
 const hash = decodeURIComponent(location.hash.slice(1) || "home");
 const parts = hash.split("/");
 if(parts[0] === "trail" && parts[1]){
   const t = trails.find(x=>x.id === parts[1]);
   app.innerHTML = t ? trailPage(t) : homePage();
 }else if(parts[0] === "guide" && parts[1]){
   const g = guides.find(x=>x.id === parts[1]);
   app.innerHTML = g ? guidePage(g) : homePage();
 }else if(parts[0] === "booking"){
   app.innerHTML = bookingPage();
   const select = document.getElementById("tour");
   if(parts[1] && select) select.value = parts[1];
   document.getElementById("bookingForm").addEventListener("submit",function(e){
     e.preventDefault();
     document.getElementById("formMessage").textContent = "Thank you! This is a demo form, so your request has not actually been sent.";
   });
 }else{
   app.innerHTML = homePage();
 }
 window.scrollTo(0,0);
}

window.addEventListener("hashchange",render);
render();
</script>
</body>
</html>
