  --green-light: #e9f1e8;
  --cream: #faf8f1;

html { scroll-behavior: smooth; }

body {

button, input, select, textarea { font: inherit; }

a { color: inherit; text-decoration: none; }

img { max-width: 100%; }

header {

}

.nav {

  margin: auto;
  padding: 14px 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.logo {

  font-size: 1.25rem;
  font-weight: 800;
  white-space: nowrap;
}

.logo span { color: var(--orange); }

.nav-links {

  align-items: center;

  flex-wrap: wrap;
}

.nav-links a {

  font-weight: 600;
}

.nav-links a:hover { color: var(--green); }

.menu-button {

  background: none;

.container {

.hero {

.hero-content {

}

.eyebrow {

h1 {

.button {

}

.button:hover {

  transform: translateY(-1px);
}

.button-light {
  background: white;
  color: var(--green);
}

.button-light:hover {
  background: var(--green-light);
  color: var(--green-dark);
}

.button-outline {

}

.button-outline:hover { color: white; }

.button-small {

}

.section { padding: 66px 0; }

.section-white { background: white; }

.section-heading {

h2 {

.section-heading p, .muted { color: var(--muted); }

  grid-template-columns: repeat(3, minmax(0, 1fr));

.trail-card {

.tag.moderate { background: #fff0d8; color: #80551c; }

.empty-state {

.stats {

.stat {

.stat strong {

.two-columns {

.feature-image {

/* ==========================================
   BASIC HELPERS
========================================== */

const app = document.getElementById("page-content");

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[char]);
}

function getStoredReviews() {
  try {
    const stored = localStorage.getItem("ecotrail-reviews");
    return stored ? JSON.parse(stored) : [];
  } catch {
    return [];
  }
}

function getAllReviews() {
  return [...sampleReviews, ...getStoredReviews()];
}

function getTrail(id) {
  return trails.find(trail => trail.id === id);
}

function getGuide(id) {
  return guides.find(guide => guide.id === id);
}

function stars(rating) {
  return '<span class="stars" aria-label="' + rating + ' out of 5 stars">' +
    "★".repeat(rating) + "☆".repeat(5 - rating) +
    "</span>";
}

function difficultyTag(difficulty) {
  const className = difficulty.toLowerCase();
  return '<span class="tag ' + className + '">' +
    escapeHTML(difficulty) + '</span>';
}

function trailAverageRating(trailId) {
  const reviews = getAllReviews().filter(review => review.trailId === trailId);
  if (!reviews.length) return null;
  return (reviews.reduce((sum, review) => sum + Number(review.rating), 0) / reviews.length).toFixed(1);
}

function trailCard(trail) {
  const rating = trailAverageRating(trail.id);

  return `
    <article class="trail-card">
      <img src="${escapeHTML(trail.image)}"
           alt="${escapeHTML(trail.name)}"
           loading="lazy"
           onerror="this.style.display='none'">

      <div class="card-content">
        ${difficultyTag(trail.difficulty)}
        <h3>${escapeHTML(trail.name)}</h3>
        <div class="card-meta">
          <span>📍 ${escapeHTML(trail.location)}</span>
          <span>🥾 ${escapeHTML(trail.distance)}</span>
          <span>⏱ ${escapeHTML(trail.duration)}</span>
        </div>
        <p>${escapeHTML(trail.description)}</p>
        ${rating ? `<p>★ ${rating} / 5 community rating</p>` : ""}
        <a class="button button-outline" href="#trail/${trail.id}">Explore Trail →</a>
      </div>
    </article>
  `;
}

function renderTrailCards(list) {
  if (!list.length) {
    return '<div class="empty-state">No trails match this difficulty. Try another filter.</div>';
  }
  return '<div class="trail-grid">' + list.map(trailCard).join("") + '</div>';
}

function renderTrailDetail(id) {
  const trail = getTrail(id);

  if (!trail) {
    renderNotFound();
    return;
  }

  const reviews = getAllReviews().filter(review => review.trailId === id);
  const average = trailAverageRating(id);

  app.innerHTML = `
    <section class="section">
      <div class="container">
        <a class="back-link" href="#trails">← All trails</a>

        <div class="detail-layout">
          <div>
            <img class="detail-image"
                 src="${escapeHTML(trail.image)}"
                 alt="${escapeHTML(trail.name)}"
                 onerror="this.style.display='none'">

            <div class="detail-facts">
              <div class="fact"><small>Difficulty</small><strong>${escapeHTML(trail.difficulty)}</strong></div>
              <div class="fact"><small>Distance</small><strong>${escapeHTML(trail.distance)}</strong></div>
              <div class="fact"><small>Duration</small><strong>${escapeHTML(trail.duration)}</strong></div>
            </div>

            <div class="panel">
              <div class="eyebrow">About this route</div>
              <h2>${escapeHTML(trail.name)}</h2>
              <p>📍 ${escapeHTML(trail.location)}</p>
              <p>${escapeHTML(trail.description)}</p>
              <h3>Hiking tips</h3>
              <p>${escapeHTML(trail.tips)}</p>
              <div class="notice warning">Trail information is provided as a project demonstration. Check current local conditions and official park guidance before hiking.</div>
              <a class="button" href="#booking">Book a guide →</a>
              <a class="button button-outline" href="#premium">Explore GPS options</a>
            </div>
          </div>

          <aside class="panel">
            <div class="eyebrow">Community feedback</div>
            <h3>Trail reviews</h3>
            ${average ? `<p>${stars(Math.round(Number(average)))} <strong>${average}/5</strong> average rating</p>` : `<p class="muted">Be the first to rate this trail.</p>`}
            <p class="muted">${reviews.length} review(s)</p>
            <a class="button button-outline" href="#community">Write a review →</a>
            <hr>
            <h3>About the difficulty</h3>
            <p class="muted">Difficulty levels are general guidance. Actual conditions can change with weather, season, and trail maintenance.</p>
          </aside>
        </div>

        <div style="margin-top:32px">
          <h2>What hikers say</h2>
          ${renderReviews(reviews)}
        </div>
      </div>
    </section>
  `;
}

function renderReviews(reviews) {
  if (!reviews.length) {
    return '<div class="empty-state">There are no reviews for this trail yet. You can be the first!</div>';
  }

  return '<div class="review-list">' + reviews.map(review => `
    <article class="review-card">
      ${stars(Number(review.rating))}
      <h3>${escapeHTML(review.name)}</h3>
      <p>${escapeHTML(review.comment)}</p>
    </article>
  `).join("") + '</div>';
}

function renderCommunity() {
  app.innerHTML = `
    <section class="section">
      <div class="container">
        <div class="eyebrow">Share your adventure</div>
        <h2>Outdoor community</h2>
        <p class="muted">Read experiences from fellow hikers and share your own trail review.</p>

        <div class="two-columns" style="align-items:start">
          <div class="panel">
            <h3>Write a trail review</h3>
            <form id="review-form" class="form-grid">
              <div class="field full">
                <label for="review-name">Your display name</label>
                <input id="review-name" name="name" maxlength="40" required placeholder="e.g. Alex">
              </div>

              <div class="field full">
                <label for="review-trail">Choose a trail</label>
                <select id="review-trail" name="trailId" required>
                  ${trails.map(trail => `<option value="${trail.id}">${escapeHTML(trail.name)}</option>`).join("")}
                </select>
              </div>

              <div class="field full">
                <label for="review-rating">Your rating</label>
                <select id="review-rating" name="rating" required>
                  <option value="5">★★★★★ — Excellent</option>
                  <option value="4">★★★★☆ — Very good</option>
                  <option value="3">★★★☆☆ — Good</option>
                  <option value="2">★★☆☆☆ — Fair</option>
                  <option value="1">★☆☆☆☆ — Poor</option>
                </select>
              </div>

              <div class="field full">
                <label for="review-comment">Your review</label>
                <textarea id="review-comment" name="comment" maxlength="500" required placeholder="Share what you enjoyed or what other hikers should know..."></textarea>
              </div>

              <div class="field full">
                <button class="button" type="submit">Submit review</button>
              </div>
            </form>
            <p id="review-message" role="status" class="muted"></p>
            <div class="notice">Demo feature: reviews are stored in this browser only. They are not published to a shared online database.</div>
          </div>

          <div>
            <h3>Community reviews</h3>
            <div id="community-reviews">${renderReviews(getAllReviews().slice().reverse())}</div>
          </div>
        </div>
      </div>
    </section>
  `;

  document.getElementById("review-form").addEventListener("submit", event => {
    event.preventDefault();

    const formData = new FormData(event.target);
    const name = String(formData.get("name") || "").trim();
    const trailId = String(formData.get("trailId") || "");
    const rating = Number(formData.get("rating"));
    const comment = String(formData.get("comment") || "").trim();

    if (!name || !getTrail(trailId) || rating < 1 || rating > 5 || !comment) {
      document.getElementById("review-message").textContent = "Please complete all fields.";
      return;
    }

    const newReview = { name, trailId, rating, comment };

    try {
      const stored = getStoredReviews();
      stored.push(newReview);
      localStorage.setItem("ecotrail-reviews", JSON.stringify(stored));

      document.getElementById("review-message").textContent = "Thank you! Your review has been saved in this browser.";
      event.target.reset();
      document.getElementById("community-reviews").innerHTML =
        renderReviews(getAllReviews().slice().reverse());
    } catch {
      document.getElementById("review-message").textContent =
        "Your browser could not save the review. You can still explore the sample reviews.";
    }
  });
}

/* ==========================================
   PAGE NAVIGATION
========================================== */

function renderPage() {
  const route = window.location.hash.slice(1) || "home";
  const parts = route.split("/");
  const page = parts[0];
  const id = parts[1];

  document.getElementById("nav-links").classList.remove("open");

  window.scrollTo({ top: 0, behavior: "auto" });

  switch (page) {
    case "home":
      renderHome();
      break;
    case "trails":
      renderTrailsPage();
      break;
    case "trail":
      renderTrailDetail(id);
      break;
    case "guides":
      renderGuides();
      break;
    case "guide":
      renderGuideDetail(id);
      break;
    case "booking":
      renderBooking();
      break;
    case "community":
      renderCommunity();
      break;
    case "premium":
      renderPremium();
      break;
    case "partners":
      renderPartners();
      break;
    case "privacy":
      renderPrivacy();
      break;
    default:
      renderNotFound();
  }
}

document.getElementById("menu-button").addEventListener("click", () => {
  document.getElementById("nav-links").classList.toggle("open");
});

window.addEventListener("hashchange", renderPage);

renderPage();
